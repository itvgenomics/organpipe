###############################################################################
# OrganPipe - Threads per rule (shared by local and SLURM modes)
#
# OrganPipe.sh appends this file to config/local_params.yaml or
# config/slurm_params.yaml to build the Snakemake profile, so the same thread
# counts are used in both modes. Edit THIS file, not profiles/*/config.yaml.
#
# Every rule runs with 1 thread unless it is listed here.
# To give a rule more threads, add or edit a line `<rule_name>: <threads>`.
#
# Local mode: a job never uses more threads than `OrganPipe.sh -t <N>`.
# SLURM mode: each job is submitted with --cpus-per-task = threads.
###############################################################################

set-threads:
  # Trimming
  run_fastp:            4
  run_cutadapt:         4

  # Assembly
  run_getorganelle:     8
  run_mitohifi:         8

  # Error correction (read mapping + Pilon)
  run_bwa_mem:          4
  run_pilon:            2

  # Images (BLAST and read mapping for the plots)
  run_blastn:           4
  run_bwa_mem_rotated:  4

  # nhmmer (ncRNA and intergenic region search)
  run_nhmmer:           4
