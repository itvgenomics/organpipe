###############################################################################
# OrganPipe - Snakemake profile for LOCAL execution (OrganPipe.sh -t <N>)
#
# This is a template. OrganPipe.sh joins this file with config/threads.yaml,
# replaces {WORKDIR}, and writes the result to profiles/local/config.yaml before
# every run. Edit THESE files, not the generated one.
#
# The total number of cores is set with `OrganPipe.sh -t <N>`. A job never uses
# more threads than that, even if a higher value is set in config/threads.yaml.
#
# Memory note: in local mode, Snakemake does not limit memory. The NOVOPlasty
# and GetOrganelle steps use up to `max_memory` (GB, from your config file) per
# job. Keep `-t` x `max_memory` within the RAM of your machine (see the README
# warning about parallelization).
###############################################################################

# ── General settings ─────────────────────────────────────────────────────────
executor: local
use-singularity: true
singularity-args: "-B {WORKDIR}:/mnt -B {WORKDIR}/tmp:/tmp --pwd /mnt --no-home --writable"
latency-wait: 30                   # seconds to wait for output files on slow file systems
show-failed-logs: True             # print the log of a failed job
keep-going: True                   # keep running independent jobs when one fails
printshellcmds: True               # print the shell command of each job
rerun-incomplete: True             # re-run jobs whose output was left incomplete
